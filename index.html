<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Modern Calculator</title>
  <link rel="stylesheet" href="style.css" />
  
</head>
<body>

  
  <div class="social-fixed-icons">
    <a href="https://www.linkedin.com/in/priyansh-agrawal-89b811223/" target="_blank">
      <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/linkedin/linkedin-original.svg" alt="LinkedIn" />
    </a>
    <a href="https://www.instagram.com/priyansh_agrawal_01/" target="_blank">
      <img src="https://upload.wikimedia.org/wikipedia/commons/a/a5/Instagram_icon.png" alt="Instagram" />
    </a>
    <a href="https://github.com/Priyanshagrawal633" target="_blank">
      <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/github/github-original.svg" alt="GitHub" />
    </a>
  </div>

  <div class="cal">
    <div class="screen" id="screen">0</div>
  
    <div class="buttons">
      <button>C</button>
      <button>⌫</button>
      <button>%</button>
      <button>/</button>

      <button>7</button>
      <button>8</button>
      <button>9</button>
      <button>*</button>

      <button>4</button>
      <button>5</button>
      <button>6</button>
      <button>-</button>

      <button>1</button>
      <button>2</button>
      <button>3</button>
      <button>+</button>

      <button class="zero">0</button>
      <button>.</button>
      <button>=</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
